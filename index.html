<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porter Empire Network</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #fafafa;
  --white: #fff;
  --black: #111;
  --gray: #737373;
  --light: #efefef;
  --border: #dbdbdb;
  --blue: #0095f6;
  --red: #ed4956;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--black);
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   TOP NAV
========================= */

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 62px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}

.topbar-inner {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 18px;

  display: flex;
  align-items: center;
  gap: 18px;
}

.logo {
  font-size: 21px;
  font-weight: 900;
  white-space: nowrap;
  letter-spacing: -1px;
}

.search {
  width: 260px;
  background: #efefef;
  border: none;
  border-radius: 10px;
  padding: 11px 15px;
  outline: none;
}

.nav {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
}

.nav button {
  border: none;
  background: transparent;
  font-size: 23px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.nav button:hover {
  background: #f1f1f1;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
}

/* =========================
   MAIN
========================= */

main {
  max-width: 1100px;
  margin: auto;
  padding: 85px 18px 80px;
}

.feed {
  max-width: 650px;
  margin: auto;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 290px;
  gap: 30px;
}

/* =========================
   STORIES
========================= */

.stories {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 10px 4px 20px;
}

.story {
  min-width: 65px;
  text-align: center;
  font-size: 11px;
}

.story-ring {
  width: 62px;
  height: 62px;
  padding: 2px;
  border-radius: 50%;
  margin: auto auto 5px;

  background: linear-gradient(
    45deg,
    #feda75,
    #fa7e1e,
    #d62976,
    #962fbf,
    #4f5bd5
  );
}

.story-ring img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid white;
}

/* =========================
   POST
========================= */

.post {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 20px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px;
}

.post-user {
  font-weight: bold;
  font-size: 14px;
}

.post-sub {
  color: var(--gray);
  font-size: 12px;
  margin-top: 2px;
}

.more {
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 20px;
}

.post-image {
  width: 100%;
  display: block;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #eee;
}

.post-actions {
  display: flex;
  align-items: center;
  padding: 8px 10px 2px;
}

.post-actions button {
  border: none;
  background: transparent;
  font-size: 26px;
  width: 40px;
  height: 40px;
}

.save {
  margin-left: auto;
}

.post-content {
  padding: 3px 14px 15px;
}

.likes {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 7px;
}

.caption {
  font-size: 14px;
  line-height: 1.5;
}

.caption strong {
  margin-right: 5px;
}

.comments {
  margin-top: 9px;
  font-size: 14px;
}

.comment {
  margin-bottom: 4px;
}

.comment-input {
  display: flex;
  margin-top: 10px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}

.comment-input input {
  flex: 1;
  border: none;
  outline: none;
  padding: 8px 0;
}

.comment-input button {
  border: none;
  background: transparent;
  color: var(--blue);
  font-weight: bold;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  position: sticky;
  top: 85px;
  height: max-content;
}

.mini-profile {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}

.mini-profile .avatar {
  width: 55px;
  height: 55px;
}

.username {
  font-weight: bold;
}

.muted {
  color: var(--gray);
  font-size: 13px;
}

.suggestion-title {
  display: flex;
  justify-content: space-between;
  color: var(--gray);
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 15px;
}

.suggestion {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 13px 0;
}

.suggestion .avatar {
  width: 40px;
  height: 40px;
}

.suggestion-info {
  flex: 1;
  font-size: 13px;
}

.follow {
  color: var(--blue);
  background: none;
  border: none;
  font-weight: bold;
  font-size: 12px;
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 2000;

  background: rgba(0,0,0,.65);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modal-box {
  width: min(600px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  background: white;
  border-radius: 18px;
  padding: 25px;
}

.close {
  float: right;
  border: none;
  background: none;
  font-size: 28px;
}

.modal-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

.form {
  display: grid;
  gap: 13px;
}

.form input,
.form textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.form textarea {
  min-height: 120px;
  resize: vertical;
}

.primary {
  background: #111;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 10px;
  font-weight: bold;
}

.secondary {
  background: white;
  border: 1px solid var(--border);
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: bold;
}

/* =========================
   PROFILE
========================= */

.profile {
  max-width: 900px;
  margin: auto;
}

.cover {
  height: 190px;
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #050505,
      #333,
      #777
    );
}

.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: -45px;
  padding: 0 20px;
  position: relative;
}

.profile-avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid white;
}

.profile-info {
  padding-top: 45px;
}

.profile-info h1 {
  font-size: 25px;
}

.profile-info p {
  color: var(--gray);
  margin-top: 5px;
}

.stats {
  display: flex;
  gap: 28px;
  margin-top: 12px;
  font-size: 14px;
}

.stats strong {
  font-size: 16px;
}

.profile-buttons {
  display: flex;
  gap: 8px;
  margin: 20px;
}

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 5px;
}

.tabs button {
  flex: 1;
  padding: 14px;
  background: none;
  border: none;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.grid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  cursor: pointer;
}

/* =========================
   EXPLORE
========================= */

.page-title {
  font-size: 28px;
  margin-bottom: 20px;
}

/* =========================
   MESSAGES
========================= */

.messages-page {
  max-width: 900px;
  margin: auto;
}

.chat {
  height: 650px;
  display: grid;
  grid-template-columns: 220px 1fr;

  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
}

.chat-list {
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

.chat-user {
  width: 100%;
  border: none;
  background: white;
  padding: 13px;

  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}

.chat-user:hover {
  background: #f5f5f5;
}

.chat-main {
  display: flex;
  flex-direction: column;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;

  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bubble {
  max-width: 70%;
  padding: 10px 13px;
  background: #eee;
  border-radius: 17px;
  align-self: flex-start;
}

.bubble.mine {
  background: #111;
  color: white;
  align-self: flex-end;
}

.chat-input {
  border-top: 1px solid var(--border);
  padding: 10px;
  display: flex;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px 15px;
}

/* =========================
   LIST
========================= */

.list {
  display: grid;
  gap: 10px;
}

.list-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 15px;

  display: flex;
  align-items: center;
  gap: 12px;
}

/* =========================
   EMPTY
========================= */

.empty {
  padding: 50px;
  text-align: center;
  color: var(--gray);
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav {
  display: none;
}

@media(max-width:800px) {

  .layout {
    display: block;
  }

  .sidebar {
    display: none;
  }

  .search {
    display: none;
  }

  .logo {
    font-size: 18px;
  }

  .topbar-inner {
    padding: 0 10px;
  }

  main {
    padding-left: 0;
    padding-right: 0;
    padding-bottom: 75px;
  }

  .post {
    border-left: none;
    border-right: none;
    border-radius: 0;
  }

  .mobile-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    height: 62px;

    background: white;
    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-around;

    z-index: 1500;
  }

  .mobile-nav button {
    border: none;
    background: none;
    font-size: 24px;
  }

  .profile-header {
    align-items: flex-start;
  }

  .profile-avatar {
    width: 90px;
    height: 90px;
  }

  .profile-info {
    padding-top: 40px;
  }

  .chat {
    height: calc(100vh - 160px);
    grid-template-columns: 85px 1fr;
  }

  .chat-user span {
    display: none;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <button
      onclick="goHome()"
      style="border:none;background:none;font-size:24px;"
    >
      ⌂
    </button>

    <div class="logo">
      Porter Empire Network
    </div>

    <input
      id="searchInput"
      class="search"
      placeholder="Search"
      oninput="searchUsers(this.value)"
    >

    <div class="nav">

      <button onclick="showExplore()">⌕</button>

      <button onclick="openCreatePost()">＋</button>

      <button onclick="showMessages()">✉</button>

      <button onclick="showNotifications()">♡</button>

      <button onclick="showProfile()">
        <img id="navAvatar" class="avatar">
      </button>

    </div>

  </div>

</header>


<main id="app"></main>


<nav class="mobile-nav">

  <button onclick="goHome()">⌂</button>

  <button onclick="showExplore()">⌕</button>

  <button onclick="openCreatePost()">＋</button>

  <button onclick="showMessages()">✉</button>

  <button onclick="showProfile()">◯</button>

</nav>


<div id="modal" class="modal hidden">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* ==========================================================
   LOCAL DATABASE
   ========================================================== */

const STORAGE_KEY = "porter_empire_network_data";


const defaultData = {

  user: {

    id: "me",

    username: "porterempirenetwork",

    name: "Porter Empire Network",

    bio: "Build. Connect. Grow. Create your empire.",

    avatar:
      "https://i.pravatar.cc/300?img=12",

    followers: 0,

    following: 3

  },


  users: [

    {

      id: "u1",

      username: "jordanbuilds",

      name: "Jordan Builds",

      bio: "Entrepreneur • Builder • Creator",

      avatar:
        "https://i.pravatar.cc/300?img=12",

      followers: 842,

      following: 311

    },

    {

      id: "u2",

      username: "mariahcreative",

      name: "Mariah Creative",

      bio: "Design • Media • Brand strategy",

      avatar:
        "https://i.pravatar.cc/300?img=47",

      followers: 1204,

      following: 198

    },

    {

      id: "u3",

      username: "nextlevelbiz",

      name: "Next Level Biz",

      bio: "Business opportunities & resources",

      avatar:
        "https://i.pravatar.cc/300?img=33",

      followers: 2310,

      following: 421

    }

  ],


  posts: [

    {

      id: "p1",

      userId: "u1",

      image:
        "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1200&q=85",

      caption:
        "Big things happen when the right people connect. What are you building?",

      likes: 127,

      liked: false,

      saved: false,

      comments: [

        {

          user: "mariahcreative",

          text: "This is exactly the energy."

        }

      ]

    },


    {

      id: "p2",

      userId: "u2",

      image:
        "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=85",

      caption:
        "Your network should open doors, share knowledge, and create opportunities.",

      likes: 89,

      liked: false,

      saved: false,

      comments: []

    },


    {

      id: "p3",

      userId: "u3",

      image:
        "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=85",

      caption:
        "Community over competition. Drop what you are working on below.",

      likes: 214,

      liked: false,

      saved: false,

      comments: []

    }

  ],


  messages: {

    u1: [

      {

        from: "u1",

        text: "Welcome to Porter Empire Network!"

      }

    ],

    u2: [

      {

        from: "u2",

        text: "Let's connect and collaborate."

      }

    ]

  },


  notifications: []

};


let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || defaultData;


let activeChat = "u1";


/* ==========================================================
   DATABASE HELPERS
   ========================================================== */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function getUser(id) {

  if (id === "me") {
    return data.user;
  }

  return (
    data.users.find(
      user => user.id === id
    ) || data.user
  );

}


/* ==========================================================
   BASIC HELPERS
   ========================================================== */

function escapeHTML(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function toast(message) {

  const box =
    document.createElement("div");

  box.textContent = message;

  box.style.position = "fixed";
  box.style.bottom = "85px";
  box.style.left = "50%";
  box.style.transform =
    "translateX(-50%)";

  box.style.background = "#111";
  box.style.color = "#fff";
  box.style.padding = "12px 18px";
  box.style.borderRadius = "10px";
  box.style.zIndex = "5000";

  document.body.appendChild(box);

  setTimeout(() => {

    box.remove();

  }, 1800);

}


/* ==========================================================
   HOME
========================================================== */

function goHome() {

  renderHome();

}


function renderHome() {

  const posts =
    [...data.posts].reverse();


  document.getElementById("app").innerHTML = `

    <div class="layout">

      <section class="feed">

        ${renderStories()}

        ${
          posts.length

          ?

          posts
            .map(post => renderPost(post))
            .join("")

          :

          `

          <div class="post">

            <div class="empty">

              No posts yet.

              <br><br>

              Create the first post.

            </div>

          </div>

          `

        }

      </section>


      <aside class="sidebar">

        ${renderSidebar()}

      </aside>

    </div>

  `;

}


/* ==========================================================
   STORIES
========================================================== */

function renderStories() {

  const stories = [

    {

      username: "Your Story",

      avatar: data.user.avatar

    },

    ...data.users

  ];


  return `

    <div class="stories">

      ${stories.map((story, index) => `

        <div
          class="story"
          onclick="${
            index === 0
              ? "openCreatePost()"
              : "toast('Story opened')"
          }"
        >

          <div class="story-ring">

            <img src="${story.avatar}">

          </div>

          ${escapeHTML(story.username)}

        </div>

      `).join("")}

    </div>

  `;

}


/* ==========================================================
   POST
========================================================== */

function renderPost(post) {

  const user =
    getUser(post.userId);


  return `

    <article
      class="post"
      id="post-${post.id}"
    >

      <div class="post-header">

        <img
          class="avatar"
          src="${user.avatar}"
        >

        <div>

          <div class="post-user">

            @${escapeHTML(user.username)}

          </div>

          <div class="post-sub">

            Porter Empire Network

          </div>

        </div>

        <button class="more">

          •••

        </button>

      </div>


      <img
        class="post-image"
        src="${post.image}"
        alt="Post"
      >


      <div class="post-actions">

        <button
          onclick="toggleLike('${post.id}')"
        >

          ${post.liked ? "♥" : "♡"}

        </button>


        <button
          onclick="focusComment('${post.id}')"
        >

          ◯

        </button>


        <button
          onclick="sharePost('${post.id}')"
        >

          ↗

        </button>


        <button
          class="save"
          onclick="toggleSave('${post.id}')"
        >

          ${post.saved ? "🔖" : "⌑"}

        </button>

      </div>


      <div class="post-content">

        <div class="likes">

          ${post.likes.toLocaleString()} likes

        </div>


        <div class="caption">

          <strong>

            @${escapeHTML(user.username)}

          </strong>

          ${escapeHTML(post.caption)}

        </div>


        <div class="comments">

          ${
            post.comments
              .slice(-3)
              .map(comment => `

                <div class="comment">

                  <strong>
                    @${escapeHTML(comment.user)}
                  </strong>

                  ${escapeHTML(comment.text)}

                </div>

              `)
              .join("")
          }

        </div>


        <div class="comment-input">

          <input
            id="comment-${post.id}"
            placeholder="Add a comment..."
            onkeydown="
              if(event.key === 'Enter')
              addComment('${post.id}', this.value)
            "
          >

          <button
            onclick="
              addComment(
                '${post.id}',
                document.getElementById('comment-${post.id}').value
              )
            "
          >

            Post

          </button>

        </div>

      </div>

    </article>

  `;

}


/* ==========================================================
   SIDEBAR
========================================================== */

function renderSidebar() {

  return `

    <div class="mini-profile">

      <img
        class="avatar"
        src="${data.user.avatar}"
      >

      <div>

        <div class="username">

          @${escapeHTML(data.user.username)}

        </div>

        <div class="muted">

          ${escapeHTML(data.user.name)}

        </div>

      </div>

    </div>


    <div class="suggestion-title">

      <span>Suggestions for you</span>

      <span>See all</span>

    </div>


    ${data.users.map(user => `

      <div class="suggestion">

        <img
          class="avatar"
          src="${user.avatar}"
        >

        <div class="suggestion-info">

          <div class="username">

            @${escapeHTML(user.username)}

          </div>

          <div class="muted">

            ${user.followers.toLocaleString()}
            followers

          </div>

        </div>

        <button
          class="follow"
          onclick="followUser('${user.id}', this)"
        >

          Follow

        </button>

      </div>

    `).join("")}

  `;

}


/* ==========================================================
   LIKE
========================================================== */

function toggleLike(id) {

  const post =
    data.posts.find(
      p => p.id === id
    );

  if (!post) return;


  post.liked = !post.liked;


  post.likes +=
    post.liked ? 1 : -1;


  if (post.liked) {

    data.notifications.unshift({

      text:
        `You liked a post from @${getUser(post.userId).username}.`

    });

  }


  saveData();

  renderHome();

}


/* ==========================================================
   SAVE
========================================================== */

function toggleSave(id) {

  const post =
    data.posts.find(
      p => p.id === id
    );

  if (!post) return;


  post.saved = !post.saved;

  saveData();

  toast(
    post.saved
      ? "Post saved"
      : "Removed from saved"
  );

  renderHome();

}


/* ==========================================================
   COMMENT
========================================================== */

function addComment(id, text) {

  text = text.trim();

  if (!text) return;


  const post =
    data.posts.find(
      p => p.id === id
    );

  if (!post) return;


  post.comments.push({

    user:
      data.user.username,

    text:
      text

  });


  saveData();

  renderHome();

}


/* ==========================================================
   SHARE
========================================================== */

function sharePost(id) {

  const url =
    location.href.split("#")[0]
    + "#post-"
    + id;


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard.writeText(url);

  }


  toast("Post link copied");

}


/* ==========================================================
   FOLLOW
========================================================== */

function followUser(id, button) {

  const user =
    getUser(id);

  user.followers++;

  data.user.following++;

  data.notifications.unshift({

    text:
      `You followed @${user.username}.`

  });


  saveData();


  button.textContent =
    "Following";

}


/* ==========================================================
   CREATE POST
========================================================== */

function openCreatePost() {

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-title">

      Create a post

    </div>


    <form
      class="form"
      onsubmit="createPost(event)"
    >

      <input
        id="postImage"
        placeholder="Image URL"
        required
      >


      <textarea
        id="postCaption"
        placeholder="Write a caption..."
        required
      ></textarea>


      <button class="primary">

        Publish Post

      </button>

    </form>

  `;


  openModal();

}


function createPost(event) {

  event.preventDefault();


  const image =
    document.getElementById(
      "postImage"
    ).value.trim();


  const caption =
    document.getElementById(
      "postCaption"
    ).value.trim();


  data.posts.push({

    id:
      "p" + Date.now(),

    userId:
      "me",

    image:

      image,

    caption:

      caption,

    likes:
      0,

    liked:
      false,

    saved:
      false,

    comments:
      []

  });


  saveData();

  closeModal();

  renderHome();

  toast("Post published!");

}


/* ==========================================================
   PROFILE
========================================================== */

function showProfile() {

  const user = data.user;


  const posts =
    data.posts.filter(
      p => p.userId === user.id
    );


  document.getElementById("app").innerHTML = `

    <section class="profile">

      <div class="cover"></div>


      <div class="profile-header">

        <img
          class="profile-avatar"
          src="${user.avatar}"
        >


        <div class="profile-info">

          <h1>
            ${escapeHTML(user.name)}
          </h1>

          <div>
            @${escapeHTML(user.username)}
          </div>

          <p>
            ${escapeHTML(user.bio)}
          </p>


          <div class="stats">

            <span>
              <strong>${posts.length}</strong>
              posts
            </span>

            <span>
              <strong>${user.followers}</strong>
              followers
            </span>

            <span>
              <strong>${user.following}</strong>
              following
            </span>

          </div>

        </div>

      </div>


      <div class="profile-buttons">

        <button
          class="primary"
          onclick="openEditProfile()"
        >

          Edit Profile

        </button>


        <button
          class="secondary"
          onclick="openCreatePost()"
        >

          Create Post

        </button>

      </div>


      <div class="tabs">

        <button>
          ▦ POSTS
        </button>

        <button
          onclick="showSaved()"
        >
          🔖 SAVED
        </button>

      </div>


      <div class="grid">

        ${
          posts.length

          ?

          posts.map(post => `

            <img

          `).join("")

          `

          <div

          </div>

}


/* ==========================================================
   EDIT PROFILE
========================================================== */

function openEditProfile() {

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="modal-title">

      Edit Profile

    </div>


    <form
      class="form"
      onsubmit="saveProfile(event)"
    >

      <input
        id="editName"
        value="${escapeHTML(data.user.name)}"
        placeholder="Name"
      >


      <input
        id="editUsername"
        value="${escapeHTML(data.user.username)}"
        placeholder="Username"
      >


      <input
        id="editAvatar"
        value="${escapeHTML(data.user.avatar)}"
        placeholder="Avatar URL"
      >


      <textarea
        id="editBio"
        placeholder="Bio"
      >${escapeHTML(data.user.bio)}</textarea>


      <button class="primary">

        Save Changes

      </button>

    </form>

  `;


  openModal();

}


function saveProfile(event) {

  event.preventDefault();


  data.user.name =
    document.getElementById(
      "editName"
    ).value.trim();


  data.user.username =
    document.getElementById(
      "editUsername"
    ).value
      .trim()
      .replace("@", "");


  data.user.avatar =
    document.getElementById(
      "editAvatar"
    ).value.trim();


  data.user.bio =
    document.getElementById(
      "editBio"
    ).value.trim();


  saveData();

  closeModal();

  showProfile();

  toast("Profile updated");

}


/* ==========================================================
   EXPLORE
========================================================== */

function showExplore() {

  document.getElementById("app").innerHTML = `

    <section class="feed">

      <h1 class="page-title">

        Explore

      </h1>


      <div class="grid">

        ${data.posts.map(post => `

          <img
            src="${post.image}"
            onclick="openPost('${post.id}')"
          >

        `).join("")}

      </div>

    </section>

  `;

}


/* ==========================================================
   SEARCH
========================================================== */

function searchUsers(query) {

  query =
    query.toLowerCase().trim();


  if (!query) {

    renderHome();

    return;

  }


  const users =
    data.users.filter(user =>

      (
        user.username
        + " "
        + user.name
      )
      .toLowerCase()
      .includes(query)

    );


  document.getElementById("app").innerHTML = `

    <section class="feed">

      <h1 class="page-title">

        Search

      </h1>


      <div class="list">

        ${
          users.length

          ?

          users.map(user => `

            <div class="list-item">

              <img
                class="avatar"
                src="${user.avatar}"
              >

              <div style="flex:1">

                <strong>
                  @${escapeHTML(user.username)}
                </strong>

                <div class="muted">
                  ${escapeHTML(user.name)}
                </div>

              </div>

              <button
                class="secondary"
                onclick="viewUser('${user.id}')"
              >

                View

              </button>

            </div>

          `).join("")

          :

          `

          <div class="empty">

            No users found.

          </div>

          `
        }

      </div>

    </section>

  `;

}


/* ==========================================================
   VIEW POST
========================================================== */

function openPost(id) {

  const post =
    data.posts.find(
      p => p.id === id
    );

  if (!post) return;


  document.getElementById(
    "modalContent"
  ).innerHTML = `

    ${renderPost(post)}

  `;


  openModal();

}


/* ==========================================================
   SAVED
========================================================== */

function showSaved() {

  const posts =
    data.posts.filter(
      p => p.saved
    );


  document.getElementById("app")
    .innerHTML = `

    <section class="feed">

      <h1 class="page-title">

        Saved

      </h1>


      <div class="grid">

        ${
          posts.length

          ?

          posts.map(post => `

            <img
              src="${post.image}"
              onclick="openPost('${post.id}')"
            >

          `).join("")

          :

          `

          <div
            class="empty"
            style="grid-column:1/-1"
          >

            Saved posts will appear here.

          </div>

          `
        }

      </div>

    </section>

  `;

}


/* ==========================================================
   MESSAGES
========================================================== */

function showMessages() {

  const user =
    getUser(activeChat);


  const messages =
    data.messages[activeChat] || [];


  document.getElementById("app")
    .innerHTML = `

    <section class="messages-page">

      <h1 class="page-title">

        Messages

      </h1>


      <div class="chat">

        <div class="chat-list">

          ${data.users.map(u => `

            <button
              class="chat-user"
              onclick="
                activeChat='${u.id}';
                showMessages();
              "
            >

              <img
                class="avatar"
                src="${u.avatar}"
              >

              <span>

                @${escapeHTML(u.username)}

              </span>

            </button>

          `).join("")}

        </div>


        <div class="chat-main">

          <div class="post-header">

            <img
              class="avatar"
              src="${user.avatar}"
            >

            <strong>
              @${escapeHTML(user.username)}
            </strong>

          </div>


          <div class="chat-messages">

            ${
              messages.map(message => `

                <div
                  class="
                    bubble
                    ${message.from === "me"
                      ? "mine"
                      : ""}
                  "
                >

                  ${escapeHTML(message.text)}

                </div>

              `).join("")
            }

          </div>


          <div class="chat-input">

            <input
              id="messageInput"
              placeholder="Message..."
              onkeydown="
                if(event.key === 'Enter')
                sendMessage()
              "
            >


            <button
              class="primary"
              onclick="sendMessage()"
            >

              Send

            </button>

          </div>

        </div>

      </div>

    </section>

  `;

}


/* ==========================================================
   SEND MESSAGE
========================================================== */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  if (!input) return;


  const text =
    input.value.trim();


  if (!text) return;


  if (!data.messages[activeChat]) {

    data.messages[activeChat] = [];

  }


  data.messages[activeChat].push({

    from: "me",

    text: text

  });


  saveData();

  showMessages();

}


/* ==========================================================
   NOTIFICATIONS
========================================================== */

function showNotifications() {

  const notifications =
    data.notifications;


  document.getElementById("app")
    .innerHTML = `

    <section class="feed">

      <h1 class="page-title">

        Notifications

      </h1>


      <div class="list">

        ${
          notifications.length

          ?

          notifications.map(n => `

            <div class="list-item">

              <span style="font-size:24px">
                ♡
              </span>

              <span>
                ${escapeHTML(n.text)}
              </span>

            </div>

          `).join("")

          :

          `

          <div class="list-item">

            You're all caught up.

          </div>

          `
        }

      </div>

    </section>

  `;

}


/* ==========================================================
   MODAL
========================================================== */

function openModal() {

  document
    .getElementById("modal")
    .classList.remove("hidden");

}


function closeModal() {

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* ==========================================================
   COMMENT FOCUS
========================================================== */

function focusComment(id) {

  setTimeout(() => {

    const input =
      document.getElementById(
        "comment-" + id
      );

    if (input) {

      input.focus();

    }

  }, 100);

}


/* ==========================================================
   NAV AVATAR
========================================================== */

function updateNavAvatar() {

  document.getElementById(
    "navAvatar"
  ).src = data.user.avatar;

}


/* ==========================================================
   INITIALIZE
========================================================== */

saveData();

updateNavAvatar();

renderHome();


/* ==========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================== */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );


</script>

</body>
</html>
