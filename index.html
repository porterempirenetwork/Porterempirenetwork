<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Porter Empire Network</title>

<meta
  name="description"
  content="Porter Empire Network — Build. Connect. Grow."
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f6f6f7;
  color:#111;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:66px;
  background:#fff;
  border-bottom:1px solid #e5e5e5;
}

.header-inner{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:20px;
  font-weight:950;
  letter-spacing:-1px;
  white-space:nowrap;
}

.search{
  width:300px;
  max-width:100%;
  border:0;
  outline:none;
  background:#f0f0f2;
  padding:11px 15px;
  border-radius:13px;
}

.header-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}

.header-nav button{
  border:0;
  background:transparent;
  border-radius:10px;
  padding:9px;
  font-size:21px;
}

.header-nav button:hover{
  background:#f1f1f1;
}

/* =========================
   LAYOUT
========================= */

.main{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 100px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,700px) 320px;
  gap:28px;
}

.card{
  background:#fff;
  border:1px solid #e2e2e2;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
}

.muted{
  color:#737373;
  font-size:13px;
}

.grow{
  flex:1;
}

/* =========================
   AVATARS
========================= */

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:1px solid #ddd;
}

.avatar-small{
  width:34px;
  height:34px;
}

.avatar-large{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #fff;
}

/* =========================
   BUTTONS
========================= */

.primary{
  background:#111;
  color:#fff;
  border:0;
  padding:11px 17px;
  border-radius:11px;
  font-weight:800;
}

.primary:hover{
  opacity:.88;
}

.secondary{
  background:#fff;
  color:#111;
  border:1px solid #d8d8d8;
  padding:10px 16px;
  border-radius:11px;
  font-weight:750;
}

.secondary:hover{
  background:#f5f5f5;
}

.follow-button{
  background:#111;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:9px 17px;
  font-weight:800;
  white-space:nowrap;
}

.follow-button.following{
  background:#fff;
  color:#111;
  border:1px solid #d7d7d7;
}

/* =========================
   STORIES
========================= */

.stories{
  display:flex;
  gap:17px;
  padding:17px;
  overflow-x:auto;
}

.story{
  min-width:67px;
  text-align:center;
  font-size:11px;
}

.story-ring{
  width:66px;
  height:66px;
  padding:3px;
  border-radius:50%;
  background:
    linear-gradient(
      45deg,
      #ffd66b,
      #f34a75,
      #9b3cc8,
      #385bd7
    );
}

.story-ring img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid white;
}

/* =========================
   POSTS
========================= */

.post-header{
  display:flex;
  align-items:center;
  gap:11px;
  padding:14px 15px;
}

.post-header button{
  border:0;
  background:transparent;
  font-size:20px;
}

.post-image{
  width:100%;
  max-height:720px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.post-actions{
  display:flex;
  gap:2px;
  padding:8px 12px;
}

.post-actions button{
  border:0;
  background:transparent;
  font-size:26px;
  padding:5px 7px;
}

.post-content{
  padding:0 15px 15px;
}

.caption{
  margin-top:8px;
  line-height:1.5;
}

.comment{
  margin-top:7px;
  font-size:14px;
}

.comment-box{
  display:flex;
  gap:8px;
  border-top:1px solid #eee;
  padding-top:10px;
  margin-top:12px;
}

.comment-box input{
  flex:1;
  border:0;
  outline:none;
}

.comment-box button{
  border:0;
  background:transparent;
  color:#1877f2;
  font-weight:800;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:sticky;
  top:88px;
  height:max-content;
}

.sidebar-card{
  padding:17px;
}

.sidebar-profile{
  display:flex;
  gap:11px;
  align-items:center;
}

.suggestion{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 0;
}

.suggestion .avatar{
  width:40px;
  height:40px;
}

/* =========================
   PROFILE
========================= */

.profile-cover{
  height:230px;
  background:
    linear-gradient(
      135deg,
      #050505,
      #303030,
      #777
    );
}

.profile-top{
  display:flex;
  gap:20px;
  padding:0 24px;
  margin-top:-55px;
}

.profile-body{
  padding-top:55px;
  padding-bottom:24px;
}

.profile-body h1{
  margin:0;
  font-size:28px;
}

.profile-stats{
  display:flex;
  gap:30px;
  margin:17px 0;
}

.profile-stat{
  display:flex;
  flex-direction:column;
}

.profile-actions{
  display:flex;
  gap:8px;
}

.post-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.post-grid img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

/* =========================
   LISTS
========================= */

.page-title{
  font-size:29px;
  margin:0 0 18px;
}

.list{
  display:grid;
  gap:10px;
}

.member-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
}

/* =========================
   AUTH
========================= */

.auth-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at top,
      #303030,
      #080808 65%
    );
}

.auth-box{
  width:min(460px,100%);
  background:#fff;
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 70px #0005;
}

.auth-box h1{
  margin-top:0;
}

.form{
  display:grid;
  gap:11px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  border:1px solid #d7d7d7;
  background:#fff;
  border-radius:11px;
  padding:12px;
  outline:none;
}

.form textarea{
  min-height:110px;
  resize:vertical;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:#0009;
  display:grid;
  place-items:center;
  padding:20px;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
}

.close{
  float:right;
  border:0;
  background:transparent;
  font-size:29px;
}

/* =========================
   MESSAGES
========================= */

.chat{
  display:grid;
  grid-template-columns:250px 1fr;
  height:650px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:17px;
  overflow:hidden;
}

.chat-list{
  border-right:1px solid #ddd;
  overflow:auto;
}

.chat-user{
  width:100%;
  border:0;
  background:#fff;
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px;
  text-align:left;
}

.chat-user:hover{
  background:#f5f5f5;
}

.chat-main{
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:72%;
  padding:10px 14px;
  background:#eee;
  border-radius:18px;
}

.message.mine{
  align-self:flex-end;
  background:#111;
  color:#fff;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:11px;
  border-top:1px solid #ddd;
}

.chat-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:22px;
  padding:10px 15px;
  outline:none;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:11px 18px;
  border-radius:11px;
  z-index:500;
}

/* =========================
   MOBILE
========================= */

.mobile-nav{
  display:none;
}

@media(max-width:850px){

  .layout{
    display:block;
  }

  .sidebar{
    display:none;
  }

  .search{
    display:none;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#fff;
    border-top:1px solid #ddd;
    z-index:150;
    justify-content:space-around;
    align-items:center;
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    font-size:23px;
  }

  .profile-top{
    gap:10px;
    padding:0 15px;
  }

  .avatar-large{
    width:85px;
    height:85px;
  }

  .profile-body{
    padding-top:45px;
  }

  .chat{
    grid-template-columns:75px 1fr;
  }

  .chat-user span{
    display:none;
  }

  .profile-actions{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rapzyhiejlqdivzdziwr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3vRhrDPn5OD_q-WiJyI8Pw_Gnk-MH_H";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let followingIds = new Set();
let activeChatUser = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function profileName(profile){

  if(!profile){
    return "PEN Member";
  }

  const name =
    [
      profile.first_name,
      profile.last_name
    ]
    .filter(Boolean)
    .join(" ");

  return name || "PEN Member";
}


function avatarURL(profile){

  return (
    profile?.avatar_url ||
    "https://i.pravatar.cc/300"
  );
}


function showToast(message){

  const element =
    document.createElement("div");

  element.className = "toast";
  element.textContent = message;

  document.body.appendChild(element);

  setTimeout(
    () => element.remove(),
    2200
  );
}


function openModal(){

  document
    .getElementById("modal")
    .classList.remove("hidden");
}


function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");
}


/* =========================================================
   AUTH
========================================================= */

function showAuth(){

  document.getElementById("app").innerHTML = `

    <div class="auth-screen">

      <div class="auth-box">

        <h1>Porter Empire Network</h1>

        <p class="muted">
          Build. Connect. Grow.
        </p>

        <div class="form">

          <input
            id="authEmail"
            type="email"
            placeholder="Email address"
          >

          <input
            id="authPassword"
            type="password"
            placeholder="Password"
          >

          <input
            id="authFirst"
            placeholder="First name"
          >

          <input
            id="authLast"
            placeholder="Last name"
          >

          <button
            class="primary"
            onclick="createAccount()"
          >
            Create Account
          </button>

          <button
            class="secondary"
            onclick="login()"
          >
            Log In
          </button>

          <div
            id="authMessage"
            class="muted"
          ></div>

        </div>

      </div>

    </div>

  `;
}


async function createAccount(){

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("authPassword")
      .value;

  const firstName =
    document
      .getElementById("authFirst")
      .value
      .trim();

  const lastName =
    document
      .getElementById("authLast")
      .value
      .trim();

  const message =
    document.getElementById("authMessage");


  if(!email){

    message.textContent =
      "Enter your email.";

    return;
  }


  if(password.length < 6){

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email,

      password

    });


  if(error){

    message.textContent =
      error.message;

    return;
  }


  if(data.user){

    const {
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .upsert({

          id:data.user.id,

          email,

          first_name:firstName,

          last_name:lastName

        });


    if(profileError){

      message.textContent =
        profileError.message;

      return;
    }
  }


  message.textContent =
    "Account created. Check your email if email confirmation is enabled.";
}


async function login(){

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("authPassword")
      .value;


  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email,

      password

    });


  if(error){

    document
      .getElementById("authMessage")
      .textContent =
        error.message;
  }
}


async function logout(){

  await supabaseClient.auth.signOut();
}


/* =========================================================
   LOAD USER
========================================================= */

async function loadCurrentUser(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if(!data.session){

    currentUser = null;
    currentProfile = null;

    showAuth();

    return false;
  }


  currentUser =
    data.session.user;


  let result =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(!result.data){

    await supabaseClient
      .from("profiles")
      .insert({

        id:currentUser.id,

        email:
          currentUser.email || ""

      });


    result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();
  }


  currentProfile =
    result.data;


  await loadFollowing();


  return true;
}


/* =========================================================
   FOLLOWING
========================================================= */

async function loadFollowing(){

  if(!currentUser){

    followingIds =
      new Set();

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("follows")
      .select("following_id")
      .eq(
        "follower_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    return;
  }


  followingIds =
    new Set(
      (data || [])
        .map(row => row.following_id)
    );
}


async function isFollowing(userId){

  return followingIds.has(userId);
}


async function toggleFollow(
  userId,
  button
){

  if(!currentUser){

    showAuth();

    return;
  }


  if(
    currentUser.id === userId
  ){

    return;
  }


  button.disabled = true;


  if(
    followingIds.has(userId)
  ){

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUser.id
        )
        .eq(
          "following_id",
          userId
        );


    if(error){

      showToast(error.message);

      button.disabled = false;

      return;
    }


    followingIds.delete(userId);

    button.textContent =
      "Follow";

    button.classList.remove(
      "following"
    );

  }else{

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_id:
            currentUser.id,

          following_id:
            userId

        });


    if(error){

      showToast(error.message);

      button.disabled = false;

      return;
    }


    followingIds.add(userId);

    button.textContent =
      "Following";

    button.classList.add(
      "following"
    );
  }


  button.disabled = false;

  await updateFollowCounts(
    userId
  );
}


async function getFollowerCount(
  userId
){

  const {
    count,
    error
  } =
    await supabaseClient
      .from("follows")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "following_id",
        userId
      );


  if(error){

    console.error(error);

    return 0;
  }


  return count || 0;
}


async function getFollowingCount(
  userId
){

  const {
    count,
    error
  } =
    await supabaseClient
      .from("follows")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "follower_id",
        userId
      );


  if(error){

    console.error(error);

    return 0;
  }


  return count || 0;
}


async function updateFollowCounts(
  userId
){

  const followers =
    await getFollowerCount(
      userId
    );

  const following =
    await getFollowingCount(
      userId
    );


  const followerElement =
    document.querySelector(
      `[data-followers="${userId}"]`
    );


  const followingElement =
    document.querySelector(
      `[data-following="${userId}"]`
    );


  if(followerElement){

    followerElement.textContent =
      followers;
  }


  if(followingElement){

    followingElement.textContent =
      following;
  }
}


/* =========================================================
   PROFILE DATA
========================================================= */

async function getProfiles(ids){

  if(!ids.length){

    return [];
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in("id",ids);


  if(error){

    console.error(error);

    return [];
  }


  return data || [];
}


/* =========================================================
   MEMBER CARD
========================================================= */

async function memberCard(profile){

  const following =
    followingIds.has(
      profile.id
    );


  return `

    <div class="member-card">

      <img
        class="avatar"
        src="${avatarURL(profile)}"
      >

      <div class="grow">

        <b>
          ${escapeHTML(
            profileName(profile)
          )}
        </b>

        <div class="muted">
          ${escapeHTML(
            profile.professional_title ||
            profile.industry ||
            "PEN Member"
          )}
        </div>

        <div class="muted">
          ${escapeHTML(
            profile.location || ""
          )}
        </div>

      </div>

      ${
        profile.id !== currentUser.id
        ?

        `

        <button
          class="follow-button ${
            following
              ? "following"
              : ""
          }"
          onclick="toggleFollow(
            '${profile.id}',
            this
          )"
        >
          ${
            following
              ? "Following"
              : "Follow"
          }
        </button>

        `

        :

        ""
      }

    </div>

  `;
}


/* =========================================================
   HOME
========================================================= */

async function home(){

  const {
    data:posts,
    error
  } =
    await supabaseClient
      .from("posts")
      .select(
        "id,user_id,content,image_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(50);


  if(error){

    showToast(error.message);

    return;
  }


  const ids =
    [
      ...new Set(
        (posts || [])
          .map(
            post =>
              post.user_id
          )
      )
    ];


  const people =
    await getProfiles(ids);


  const profileMap =
    new Map(
      people.map(
        p => [p.id,p]
      )
    );


  const postHTML = [];


  for(
    const post of posts || []
  ){

    postHTML.push(
      await renderPost(
        post,
        profileMap.get(
          post.user_id
        )
      )
    );
  }


  const peopleResult =
    await supabaseClient
      .from("profiles")
      .select("*")
      .neq(
        "id",
        currentUser.id
      )
      .limit(10);


  let suggestions = "";


  for(
    const person
    of peopleResult.data || []
  ){

    suggestions +=

async function renderPost(
  post,
  user
){

  const {
    data:likes
  } =
    await supabaseClient
      .from("post_likes")
      .select("user_id")
      .eq(
        "post_id",
        post.id
      );


  const liked =
    (likes || [])
      .some(
        like =>
          like.user_id ===
          currentUser.id
      );


  const {
    data:comments
  } =
    await supabaseClient
      .from("post_comments")
      .select(
        "id,user_id,body,created_at"
      )
      .eq(
        "post_id",
        post.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      )
      .limit(5);


  const commentUsers =
    await getProfiles(
      (comments || [])
        .map(
          c => c.user_id
        )
    );


  const userMap =
    new Map(
      commentUsers.map(
        u => [u.id,u]
      )
    );


  return `

    <article class="card">

      <div class="post-header">

        <img
          class="avatar"
          src="${avatarURL(user)}"
        >

        <div class="grow">

          <b>
            ${escapeHTML(
              profileName(user)
            )}
          </b>

          <div class="muted">
            ${escapeHTML(
              user?.professional_title ||
              user?.industry ||
              "PEN Member"
            )}
          </div>

        </div>

        <button>
          •••
        </button>

      </div>


      ${
        post.image_url
        ?

        `
        <img
          class="post-image"
          src="${escapeHTML(
            post.image_url
          )}"
        >
        `

        :

        ""
      }


      <div class="post-actions">

        <button
          onclick="toggleLike(
            '${post.id}'
          )"
        >
          ${
            liked
              ? "♥"
              : "♡"
          }
        </button>

        <button
          onclick="focusComment(
            '${post.id}'
          )"
        >
          ◯
        </button>

        <button
          onclick="sharePost(
            '${post.id}'
          )"
        >
          ↗
        </button>

      </div>


      <div class="post-content">

        <b>
          ${
            (likes || []).length
          }
          likes
        </b>


        <div class="caption">

          <b>
            ${escapeHTML(
              profileName(user)
            )}
          </b>

          ${escapeHTML(
            post.content
          )}

        </div>


        ${
          (comments || [])
            .map(
              comment => `

                <div class="comment">

                  <b>
                    ${escapeHTML(
                      profileName(
                        userMap.get(
                          comment.user_id
                        )
                      )
                    )}
                  </b>

                  ${escapeHTML(
                    comment.body
                  )}

                </div>

              `
            )
            .join("")
        }


        <div class="comment-box">

          <input
            id="comment-${post.id}"
            placeholder="Add a comment..."
            onkeydown="
              if(event.key==='Enter'){
                addComment('${post.id}')
              }
            "
          >

          <button
            onclick="
              addComment('${post.id}')
            "
          >
            Post
          </button>

        </div>

      </div>

    </article>

  `;
}


async function toggleLike(
  postId
){

  const existing =
    await supabaseClient
      .from("post_likes")
      .select("post_id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if(existing.data){

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  }else{

    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:postId,

        user_id:currentUser.id

      });
  }


  await home();
}


async function addComment(
  postId
){

  const input =
    document.getElementById(
      "comment-" + postId
    );


  if(
    !input ||
    !input.value.trim()
  ){

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("post_comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        body:
          input.value.trim()

      });


  if(error){

    showToast(error.message);

    return;
  }


  await home();
}


function focusComment(
  postId
){

  setTimeout(
    () =>
      document
        .getElementById(
          "comment-" + postId
        )
        ?.focus(),

    100
  );
}


function sharePost(
  postId
){

  const url =
    location.href.split("#")[0] +
    "#post-" +
    postId;


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(url);
  }


  showToast(
    "Post link copied."
  );
}

async function searchPeople(
  query
){

  query =
    query.trim();


  if(query.length < 2){

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .or(
        `first_name.ilike.%${query}%,last_name.ilike.%${query}%,professional_title.ilike.%${query}%,industry.ilike.%${query}%`
      )
      .limit(40);


  if(error){

    showToast(
      error.message
    );

    return;
  }


  let html = "";


  for(
    const user
    of data || []
  ){

    html +=
      await memberCard(
        user
      );
  }


  document.getElementById(
    "app"
  ).innerHTML = `

    ${header()}

    <main class="main">

      <h1 class="page-title">
        People
      </h1>

      <div class="list">
        ${
          html ||
          "<p class='muted'>No members found.</p>"
        }
      </div>

    </main>

    ${mobileNav()}

  `;
}

async function openChat(
  userId
){

  activeChatUser =
    userId;


  const user =
    (
      await getProfiles([
        userId
      ])
    )[0];


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},recipient_id.eq.${userId}),and(sender_id.eq.${userId},recipient_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    showToast(
      error.message
    );

    return;
  }


  document.getElementById(
    "modal-content"
  ).innerHTML = `

    <h2>
      Message
      ${escapeHTML(
        profileName(user)
      )}
    </h2>

    <div
      class="messages"
      style="height:350px"
    >

      ${
        (data || [])
          .map(
            message => `

              <div
                class="message ${
                  message.sender_id ===
                  currentUser.id
                    ? "mine"
                    : ""
                }"
              >
                ${escapeHTML(
                  message.body
                )}
              </div>

            `
          )
          .join("")
      }

    </div>

    <div class="chat-input">

      <input
        id="messageInput"
        placeholder="Write a message..."
        onkeydown="
          if(event.key==='Enter'){
            sendMessage()
          }
        "
      >

      <button
        class="primary"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  `;


  openModal();
}


async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const body =
    input.value.trim();


  if(!body){

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        recipient_id:
          activeChatUser,

        body

      });


  if(error){

    showToast(
      error.message
    );

    return;
  }


  await openChat(
    activeChatUser
  );
}

        followingIds =
          new Set();

        showAuth();

      }

    }
  );

(async function(){

  const loggedIn =
    await loadCurrentUser();


  if(loggedIn){

})();
