<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Porter Empire Network</title>

<meta
  name="description"
  content="Porter Empire Network — Connect. Build. Grow."
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#000;
  --surface:#080808;
  --surface2:#111;
  --border:#262626;
  --text:#fff;
  --muted:#999;
  --blue:#0095f6;
  --danger:#ff3040;
  --green:#35c759;
}

*{
  box-sizing:border-box;
}

html{
  background:#000;
  color-scheme:dark;
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

a{
  color:inherit;
  text-decoration:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:#000;
  border-bottom:1px solid var(--border);
}

.topbar-inner{
  max-width:1100px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:20px;
}

.brand{
  font-size:21px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.search{
  width:270px;
  background:#1a1a1a;
  border:0;
  outline:0;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
}

.nav{
  margin-left:auto;
  display:flex;
  gap:4px;
}

.nav button{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:12px;
  font-size:22px;
}

.nav button:hover{
  background:#171717;
}

.app-main{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 100px;
}

.feed{
  width:min(620px,100%);
  margin:auto;
}

.card{
  background:#050505;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.page-title{
  margin:0 0 18px;
  font-size:27px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.stories{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding:15px;

}

.stories::-webkit-scrollbar{

}

.story{

  text-align:center;
  font-size:11px;
  cursor:pointer;
}

.story-ring{
  width:64px;
  height:64px;
  padding:3px;
  border-radius:50%;
  background:
    linear-gradient(
      45deg,
      #feda75,
      #fa7e1e,
      #d62976,
      #962fbf,
      #4f5bd5

}

.story-ring img{

  height:58px;
  border-radius:50%;

  border:3px solid #000;
}

.post{

}

.post-head{
  display:flex;

  gap:11px;
  padding:13px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;

}

.avatar-small{
  width:34px;
  height:34px;
}

.post-head-name{
  font-weight:750;
}

.post-head-title{
  color:#888;
  font-size:12px;
}

.post-menu{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#fff;
  font-size:21px;
}

.post-image{
  width:100%;
  max-height:700px;
  object-fit:cover;
  display:block;
  background:#111;
}

.post-actions{
  display:flex;
  gap:3px;
  padding:8px 10px 2px;
}

.post-actions button{
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  padding:5px;
}

.post-actions .liked{

}

.post-body{
  padding:0 14px 15px;
}

.likes{
  font-size:14px;
  font-weight:750;
  margin:4px 0 8px;
}

.caption{
  line-height:1.5;
  font-size:14px;
}

.comment{
  margin-top:7px;
  font-size:14px;
}

.comment strong{
  margin-right:4px;
}

.comment-input{
  display:flex;
  border-top:1px solid var(--border);
  margin-top:12px;
  padding-top:9px;
}

.comment-input input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
}

.comment-input button{
  border:0;
  background:transparent;
  color:var(--blue);
  font-weight:800;
}

.primary{
  background:#fff;
  color:#000;
  border:0;
  padding:10px 17px;
  border-radius:9px;
  font-weight:800;
}

.blue{
  background:var(--blue);
  color:#fff;
}

.outline{
  background:transparent;
  color:#fff;
  border:1px solid #444;
  padding:9px 15px;
  border-radius:9px;
  font-weight:750;
}

.follow{
  background:#0095f6;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:8px 15px;
  font-weight:800;
}

.following{
  background:#1b1b1b;
  color:#fff;
  border:1px solid #333;
}

.auth{
  min-height:100vh;
  background:#000;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-box{
  width:min(430px,100%);
  border:1px solid var(--border);
  border-radius:18px;
  padding:32px 28px;
  background:#050505;
}

.auth-logo{
  font-size:29px;
  font-weight:950;
  text-align:center;
  margin-bottom:7px;
}

.auth-tagline{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

.auth-section{
  display:grid;
  gap:10px;
}

.auth-section h2{
  margin:0 0 3px;
  font-size:18px;
}

.form{
  display:grid;
  gap:10px;
}

.form input,
.form textarea{
  width:100%;
  background:#111;
  border:1px solid #292929;
  color:#fff;
  border-radius:9px;
  padding:12px;
  outline:none;
}

.form input:focus,
.form textarea:focus{
  border-color:#555;
}

.form textarea{
  min-height:120px;
  resize:vertical;
}

.auth-message{
  text-align:center;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
  min-height:20px;
}

.success{
  color:var(--green);
}

.error{
  color:var(--danger);
}

.profile{
  width:min(900px,100%);
  margin:auto;
}

.profile-header{
  display:flex;
  gap:35px;
  padding:25px 10px;
}

.profile-avatar{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.profile-info{
  flex:1;
}

.profile-name{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.profile-name h1{
  margin:0;
  font-size:26px;
}

.profile-stats{
  display:flex;
  gap:28px;
  margin:22px 0;
}

.stat{
  display:flex;
  flex-direction:column;
}

.stat strong{
  font-size:17px;
}

.profile-bio{
  line-height:1.5;
  color:#ddd;
  white-space:pre-wrap;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.profile-grid img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#111;
}

.member{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.member:last-child{
  border-bottom:0;
}

.member-info{
  flex:1;
  min-width:0;
}

.messages-page{
  width:min(850px,100%);
  margin:auto;
}

.message-list{
  display:grid;
}

.message-user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.message-user:last-child{
  border-bottom:0;
}

.message-user-info{
  flex:1;
  min-width:0;
}

.chat{
  height:650px;
  display:flex;
  flex-direction:column;
}

.chat-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.bubble{
  max-width:75%;
  padding:10px 14px;
  border-radius:18px;
  background:#202020;
  align-self:flex-start;
  word-break:break-word;
}

.bubble.mine{
  align-self:flex-end;
  background:#0095f6;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--border);
}

.chat-input input{
  flex:1;
  background:#151515;
  border:0;
  border-radius:22px;
  padding:11px 15px;
  color:#fff;
  outline:0;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:#000c;
  display:grid;
  place-items:center;
  padding:18px;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#080808;
  border:1px solid #292929;
  border-radius:18px;
  padding:22px;
}

.modal-close{
  float:right;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
}

.toast{
  position:fixed;
  z-index:999;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:11px 18px;
  border-radius:10px;
  font-weight:700;
  max-width:90%;
  text-align:center;
}

.mobile-nav{
  display:none;
}

@media(max-width:850px){

  .topbar{
    height:58px;
  }

  .topbar-inner{
    padding:0 12px;
  }

  .brand{
    font-size:19px;
  }

  .search{
    display:none;
  }

  .nav{
    gap:0;
  }

  .nav button{
    width:37px;
    font-size:20px;
  }

  .app-main{
    padding:12px 0 80px;
  }

  .feed{
    width:100%;
  }

  .card{
    border-left:0;
    border-right:0;
    border-radius:0;
  }

  .post{
    border-bottom:1px solid var(--border);
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    left:0;
    right:0;
    bottom:0;
    height:62px;
    background:#000;
    border-top:1px solid var(--border);
    z-index:200;
    justify-content:space-around;
    align-items:center;
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    color:#fff;
    font-size:23px;
  }

  .profile-header{
    gap:18px;
    padding:20px 14px;
  }

  .profile-avatar{
    width:90px;
    height:90px;
  }

  .profile-name h1{
    font-size:20px;
  }

  .profile-stats{
    gap:18px;
    margin:14px 0;
  }

  .profile-grid{
    gap:2px;
  }

  .chat{
    height:75vh;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rapzyhiejlqdivzdziwr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3vRhrDPn5OD_q-WiJyI8Pw_Gnk-MH_H";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let user = null;
let profile = null;
let following = new Set();
let activeChat = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function safeURL(value){

  const url =
    String(value || "").trim();

  if(!url)
    return "";

  try{

    const parsed =
      new URL(url,window.location.href);

    if(
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    ){

      return escapeHTML(
        parsed.href
      );

    }

  }catch(e){}

  return "";
}


function nameOf(p){

  if(!p)
    return "PEN Member";

  return [
    p.first_name,
    p.last_name
  ]
  .filter(Boolean)
  .join(" ") || "PEN Member";
}


function avatarOf(p){

  const url =
    p?.avatar_url;

  return safeURL(url) ||
    "https://i.pravatar.cc/300";
}


function timeAgo(date){

  if(!date)
    return "";

  const seconds =
    Math.max(
      0,
      Math.floor(
        (
          Date.now() -
          new Date(date).getTime()
        ) / 1000
      )
    );

  if(seconds < 60)
    return seconds + "s";

  if(seconds < 3600)
    return Math.floor(seconds / 60) + "m";

  if(seconds < 86400)
    return Math.floor(seconds / 3600) + "h";

  if(seconds < 604800)
    return Math.floor(seconds / 86400) + "d";

  return new Date(date).toLocaleDateString();
}


function toast(text){

  const el =
    document.createElement("div");

  el.className = "toast";
  el.textContent = text;

  document.body.appendChild(el);

  setTimeout(
    () => el.remove(),
    2200
  );
}


function openModal(html){

  document.getElementById(
    "modalContent"
  ).innerHTML = html;

  document.getElementById(
    "modal"
  ).classList.remove("hidden");
}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.add("hidden");

  activeChat = null;
}


/* =========================================================
   AUTH EMAIL NOTIFICATION
========================================================= */

async function sendAuthEmail(event){

  try{

    const {
      data:{
        session
      }
    } =
      await db.auth.getSession();


    if(!session?.access_token){

      console.warn(
        "PEN auth email skipped: no active session."
      );

      return;
    }


    const {
      error
    } =
      await db.functions.invoke(
        "pen-auth-email",
        {
          body:{
            event:event
          }
        }
      );


    if(error){

      console.error(
        "PEN auth email error:",
        error
      );

    }

  }catch(error){

    console.error(
      "PEN auth email exception:",
      error
    );

  }
}


/* =========================================================
   HEADER
========================================================= */

function header(){

  return `

    <header class="topbar">

      <div class="topbar-inner">

        <button
          class="brand"
          style="border:0;background:none;color:#fff"
          onclick="home()"
        >
          PEN
        </button>

        <input
          class="search"
          id="globalSearch"
          placeholder="Search"
          onkeydown="
            if(event.key==='Enter'){
              searchUsers(this.value)
            }
          "
        >

        <nav class="nav">

          <button onclick="home()">⌂</button>

          <button onclick="explore()">⌕</button>

          <button onclick="createPost()">＋</button>

          <button onclick="messages()">✉</button>

          <button onclick="notifications()">♡</button>

          <button onclick="profilePage(user.id)">◎</button>

        </nav>

      </div>

    </header>

  `;
}


function mobileNav(){

  return `

    <div class="mobile-nav">

      <button onclick="home()">⌂</button>

      <button onclick="explore()">⌕</button>

      <button onclick="createPost()">＋</button>

      <button onclick="notifications()">♡</button>

      <button onclick="profilePage(user.id)">◎</button>

    </div>

  `;
}


/* =========================================================
   PAGE 1 — AUTH
========================================================= */

function showAuth(){

  document.getElementById("app").innerHTML = `

    <div class="auth">

      <div class="auth-box">

        <div class="auth-logo">
          Porter Empire Network
        </div>

        <div class="auth-tagline">
          Connect. Build. Grow.
        </div>

        <div class="auth-section">

          <h2>Create your PEN account</h2>

          <div class="form">

            <input
              id="first"
              placeholder="First name"
              autocomplete="given-name"
            >

            <input
              id="last"
              placeholder="Last name"
              autocomplete="family-name"
            >

            <input
              id="email"
              type="email"
              placeholder="Email"
              autocomplete="email"
            >

            <input
              id="password"
              type="password"
              placeholder="Password"
              autocomplete="new-password"
            >

            <button
              class="primary blue"
              onclick="signup()"
            >
              Create Account
            </button>

          </div>

        </div>

        <div
          style="
            height:1px;
            background:#222;
            margin:24px 0;
          "
        ></div>

        <div class="auth-section">

          <h2>Already have an account?</h2>

          <div class="form">

            <input
              id="loginEmail"
              type="email"
              placeholder="Email"
              autocomplete="email"
            >

            <input
              id="loginPassword"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            >

            <button
              class="outline"
              onclick="login()"
            >
              Log In
            </button>

            <button
              class="outline"
              onclick="resetPassword()"
            >
              Forgot Password?
            </button>

          </div>

        </div>

        <div
          id="authMessage"
          class="auth-message"
          style="margin-top:18px"
        ></div>

      </div>

    </div>

  `;
}


async function signup(){

  const first =
    document.getElementById("first")
      .value.trim();

  const last =
    document.getElementById("last")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const msg =
    document.getElementById(
      "authMessage"
    );


  msg.className =
    "auth-message";


  if(!first){

    msg.textContent =
      "Enter your first name.";

    return;
  }


  if(!last){

    msg.textContent =
      "Enter your last name.";

    return;
  }


  if(!email){

    msg.textContent =
      "Enter your email.";

    return;
  }


  if(password.length < 6){

    msg.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  msg.textContent =
    "Creating your PEN account...";


  const {
    data,
    error
  } =
    await db.auth.signUp({

      email,

      password,

      options:{
        data:{
          first_name:first,
          last_name:last
        },

        emailRedirectTo:
          window.location.origin +
          window.location.pathname
      }

    });


  if(error){

    msg.className =
      "auth-message error";

    msg.textContent =
      error.message;

    return;
  }


  if(data?.session){

    try{

      await ensureProfile(
        data.user
      );

      await sendAuthEmail(
        "signup"
      );

      msg.className =
        "auth-message success";

      msg.textContent =
        "Account created. Welcome to PEN!";


      setTimeout(
        () => home(),
        700
      );

    }catch(error){

      console.error(error);

      msg.className =
        "auth-message error";

      msg.textContent =
        "Account was created, but your profile could not be loaded.";

    }

  }else{

    msg.className =
      "auth-message success";

    msg.textContent =
      "Account created. Check your email to verify your account, then log in.";
  }
}


async function login(){

  const email =
    (
      document.getElementById(
        "loginEmail"
      )?.value || ""
    ).trim();

  const password =
    document.getElementById(
      "loginPassword"
    )?.value || "";

  const msg =
    document.getElementById(
      "authMessage"
    );


  msg.className =
    "auth-message";


  if(!email){

    msg.textContent =
      "Enter your email.";

    return;
  }


  if(!password){

    msg.textContent =
      "Enter your password.";

    return;
  }


  msg.textContent =
    "Logging in...";


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,

      password

    });


  if(error){

    msg.className =
      "auth-message error";

    msg.textContent =
      error.message;

    return;
  }


  if(data?.session){

    try{

      await ensureProfile(
        data.user
      );

      await sendAuthEmail(
        "login"
      );

      msg.className =
        "auth-message success";

      msg.textContent =
        "Logged in successfully.";

      setTimeout(
        () => home(),
        400
      );

    }catch(error){

      console.error(error);

      msg.className =
        "auth-message error";

      msg.textContent =
        "Logged in, but your profile could not be loaded.";
    }
  }
}


async function resetPassword(){

  const email =
    (
      document.getElementById(
        "loginEmail"
      )?.value ||
      document.getElementById(
        "email"
      )?.value ||
      ""
    ).trim();


  if(!email){

    toast(
      "Enter your email first."
    );

    return;
  }


  const {
    error
  } =
    await db.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    );


  if(error){

    toast(
      error.message
    );

    return;
  }


  toast(
    "Password reset email sent."
  );
}

   PROFILE
========================================================= */

async function ensureProfile(authUser){

  let {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",authUser.id)
      .maybeSingle();


  if(error)
    throw error;


  if(!data){

    const meta =
      authUser.user_metadata || {};


    const result =
      await db
        .from("profiles")
        .upsert({

          id:authUser.id,

          email:
            authUser.email || "",

          first_name:
            meta.first_name || "",

          last_name:
            meta.last_name || ""

        },{
          onConflict:"id"
        });


    if(result.error)
      throw result.error;


    const loaded =
      await db
        .from("profiles")
        .select("*")
        .eq("id",authUser.id)
        .single();


    if(loaded.error)
      throw loaded.error;


    data =
      loaded.data;
  }


  profile =
    data;

  return data;
}


async function loadSession(){

  const {
    data
  } =
    await db.auth.getSession();


  if(!data.session){

    user = null;

    profile = null;

    showAuth();

    return false;
  }


  user =
    data.session.user;


  try{

    await ensureProfile(
      user
    );

    await loadFollowing();

    return true;

  }catch(error){

    console.error(error);

    toast(
      "Profile could not be loaded."
    );

    return false;
  }
}

async function loadFollowing(){

  if(!user){

    following =
      new Set();

    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("follows")
      .select("following_id")
      .eq(
        "follower_id",
        user.id
      );


  if(error){

    console.error(error);

    return;
  }


  following =
    new Set(
      (data || [])
        .map(
          x => x.following_id
        )
    );
}


async function toggleFollow(id){

  if(!user){

    showAuth();

    return;
  }


  if(id === user.id)
    return;


  if(following.has(id)){

    const {
      error
    } =
      await db
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          user.id
        )
        .eq(
          "following_id",
          id
        );


    if(error){

      toast(
        error.message
      );

      return;
    }


    following.delete(id);

  }else{

    const {
      error
    } =
      await db
        .from("follows")
        .insert({

          follower_id:user.id,

          following_id:id

        });


    if(error){

      toast(
        error.message
      );

      return;
    }


    following.add(id);
  }


  const buttons =
    document.querySelectorAll(
      `[data-follow="${id}"]`
    );


  buttons.forEach(btn => {

    const isFollowing =
      following.has(id);

    btn.textContent =
      isFollowing
        ? "Following"
        : "Follow";

    btn.classList.toggle(
      "following",
      isFollowing
    );

  });
}

  if(!clean.length)

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .in("id",clean);


  if(error){

    console.error(error);

    return [];
  }


  return data || [];
}

async function toggleLike(postId){

  const {
    data:existing
  } =
    await db
      .from("likes")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(existing){

    const {
      error
    } =
      await db
        .from("likes")
        .delete()
        .eq(
          "id",
          existing.id
        );


    if(error){

      toast(
        error.message
      );

      return;
    }

  }else{

    const {
      error
    } =
      await db
        .from("likes")
        .insert({

          user_id:user.id,

          post_id:postId

        });


    if(error){

      toast(
        error.message
      );

      return;
    }
  }


  const {
    count
  } =
    await db
      .from("likes")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq(
        "post_id",
        postId
      );


  const likeText =
    document.querySelector(
      `[data-likes="${postId}"]`
    );


  if(likeText){

    likeText.textContent =
      `${count || 0} likes`;
  }


  const button =
    document.querySelector(
      `[data-like="${postId}"]`
    );


  if(button){

    const liked =
      !existing;

    button.textContent =
      liked
        ? "♥"
        : "♡";

    button.classList.toggle(
      "liked",
      liked
    );
  }
}


async function addComment(postId){

  const input =
    document.getElementById(
      `comment-${postId}`
    );


  if(!input)
    return;


  const body =
    input.value.trim();


  if(!body)
    return;


  const {
    error
  } =
    await db
      .from("comments")
      .insert({

        user_id:user.id,

        post_id:postId,

        body

      });


  if(error){

    toast(
      error.message
    );

    return;
  }


  input.value = "";

  toast(
    "Comment posted."
  );

  await home();
}


function focusComment(postId){

  const input =
    document.getElementById(
      `comment-${postId}`
    );


  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }
}

function createPost(){

  openModal(`

        id="postText"

async function submitPost(){

  const content =
    document.getElementById(
      "postText"
    ).value.trim();


  const image =
    document.getElementById(
      "postImage"
    ).value.trim();


  if(!content && !image){

    toast(
      "Write something or add an image."
    );

    return;
  }


  if(image){

    try{

      const parsed =
        new URL(image);

      if(
        parsed.protocol !== "http:" &&
        parsed.protocol !== "https:"
      ){

        toast(
          "Please use a valid image URL."
        );

        return;
      }

    }catch(e){

      toast(
        "Please enter a valid image URL."
      );

      return;
    }
  }


  const {
    error
  } =
    await db
      .from("posts")
      .insert({

        user_id:user.id,

        content:
          content || null,

        image_url:
          image || null

      });


  if(error){

    toast(
      error.message
    );

    return;
  }


  closeModal();

  toast(
    "Posted."
  );

  await home();
}

async function searchUsers(query){

  query =
    query.trim();


  if(!query){

    await explore();

    return;
  }


  const safe =
    query
      .replace(/[%_,]/g,"")
      .trim();


  if(!safe){

    await explore();

    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .or(
        `first_name.ilike.%${safe}%,last_name.ilike.%${safe}%,professional_title.ilike.%${safe}%,industry.ilike.%${safe}%`
      )
      .limit(50);


  if(error){

    toast(
      error.message
    );

    return;
  }


  renderMembers(
    data || [],
    `Search: ${query}`
  );
}

                    <div class="muted">
                      ${escapeHTML(
                        p.professional_title || ""
                      )}
                    </div>

                  </div>

                  <button
                    class="primary blue"
                    onclick="openChat('${escapeHTML(p.id)}')"
                  >
                    Message
                  </button>

                </div>

              `)
              .join("")
          }

        </div>

      </div>

    </main>

    ${mobileNav()}

  `;
}


async function openChatFromPost(id){

  if(id === user.id)
    return;

  await openChat(id);
}


async function openChat(id){

  if(!user){

    showAuth();

    return;
  }


  activeChat =
    id;


  const profiles =
    await getProfiles([id]);


  const other =
    profiles[0];


  if(!other){

    toast(
      "Member not found."
    );

    return;
  }


  await renderChat(
    other
  );
}


async function renderChat(other){

  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${user.id},recipient_id.eq.${other.id}),and(sender_id.eq.${other.id},recipient_id.eq.${user.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    toast(
      error.message
    );

    return;
  }


  openModal(`

    <div class="chat">

      <div class="chat-header">

        <img
          class="avatar-small avatar"
          src="${avatarOf(other)}"
          alt=""
        >

        <strong>
          ${escapeHTML(
            nameOf(other)
          )}
        </strong>

      </div>

      <div
        class="chat-messages"
        id="chatMessages"
      >

        ${
          (data || [])
            .map(m => `

              <div
                class="bubble ${
                  m.sender_id === user.id
                    ? "mine"
                    : ""
                }"
              >
                ${escapeHTML(
                  m.body
                )}
              </div>

            `)
            .join("")
        }

      </div>

      <div class="chat-input">

        <input
          id="chatInput"
          placeholder="Message..."
          autocomplete="off"
          onkeydown="
            if(event.key==='Enter'){
              sendMessage()
            }
          "
        >

        <button
          class="primary blue"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  `);


  setTimeout(() => {

    const box =
      document.getElementById(
        "chatMessages"
      );

    if(box){

      box.scrollTop =
        box.scrollHeight;
    }

  },50);
}


async function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );


  if(!input || !activeChat)
    return;


  const body =
    input.value.trim();


  if(!body)
    return;


  const {
    error
  } =
    await db
      .from("messages")
      .insert({

        sender_id:user.id,

        recipient_id:activeChat,

        body

      });


  if(error){

    toast(
      error.message
    );

    return;
  }


  input.value = "";


  const other =
    (
      await getProfiles([
        activeChat
      ])
    )[0];


  await renderChat(
    other
  );
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function notifications(){

  if(!user){

    showAuth();

    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("notifications")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(100);


  if(error){

    toast(
      error.message
    );

    return;
  }


  const actors =
    await getProfiles(
      (data || [])
        .map(
          n => n.actor_id
        )
    );


  const map =
    new Map(
      actors.map(
        x => [
          x.id,
          x
        ]
      )
    );


  document.getElementById(
    "app"
  ).innerHTML = `

    ${header()}

    <main class="app-main">

      <div class="feed">

        <h1 class="page-title">
          Activity
        </h1>

        <div class="card">

          ${
            (data || []).length
            ?
            data
              .map(n => {

                const actor =
                  map.get(
                    n.actor_id
                  );

                let text =
                  "You have new activity.";


                if(n.type === "follow")
                  text =
                    `${nameOf(actor)} followed you.`;


                if(n.type === "like")
                  text =
                    `${nameOf(actor)} liked your post.`;


                if(n.type === "comment")
                  text =
                    `${nameOf(actor)} commented on your post.`;


                if(n.type === "message")
                  text =
                    `${nameOf(actor)} sent you a message.`;


                return `

                  <div class="member">

                    <img
                      class="avatar"
                      src="${avatarOf(actor)}"
                      alt=""
                    >

                    <div class="member-info">

                      <div>
                        ${escapeHTML(text)}
                      </div>

                      <div class="muted">
                        ${timeAgo(
                          n.created_at
                        )}
                      </div>

                    </div>

                  </div>

                `;

              })
              .join("")
            :
            `
              <div style="padding:30px">
                No activity yet.
              </div>
            `
          }

        </div>

      </div>

    </main>

    ${mobileNav()}

  `;


  await db
    .from("notifications")
    .update({
      read_at:
        new Date().toISOString()
    })
    .eq(
      "user_id",
      user.id
    )
    .is(
      "read_at",
      null
    );
}

      >

async function saveProfile(){

  const values = {

    first_name:
      document.getElementById(
        "editFirst"
      ).value.trim(),

    last_name:
      document.getElementById(
        "editLast"
      ).value.trim(),

    professional_title:
      document.getElementById(
        "editTitle"
      ).value.trim(),

    industry:
      document.getElementById(
        "editIndustry"
      ).value.trim(),

    location:
      document.getElementById(
        "editLocation"
      ).value.trim(),

    avatar_url:
      document.getElementById(
        "editAvatar"
      ).value.trim(),

    bio:
      document.getElementById(
        "editBio"
      ).value.trim(),

    website:
      document.getElementById(
        "editWebsite"
      ).value.trim(),

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await db
      .from("profiles")
      .update(values)
      .eq(
        "id",
        user.id
      );


  if(error){

    toast(
      error.message
    );

    return;
  }


  profile =
    await ensureProfile(
      user
    );


  closeModal();

  toast(
    "Profile updated."
  );

  await profilePage(
    user.id
  );
}


/* =========================================================
   VIEW POST
========================================================= */

async function viewPost(id){

  const {
    data,
    error
  } =
    await db
      .from("posts")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if(error){

    toast(
      error.message
    );

    return;
  }


  const p =
    (
      await getProfiles([
        data.user_id
      ])
    )[0];


  openModal(
    await renderPost(
      data,
      p
    )
  );
}


/* =========================================================
   REALTIME
========================================================= */

db
  .channel("pen-realtime")
  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"follows"
    },
    async () => {

      if(user){

        await loadFollowing();

      }

    }
  )
  .subscribe();


/* =========================================================
   AUTH STATE
========================================================= */

db.auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if(session){

        user =
          session.user;

        try{

          await ensureProfile(
            user
          );

          await loadFollowing();

          /*
            Do not send another login email here.
            login() already sends it.
            This listener can also fire on refresh,
            so sending here would create duplicate emails.
          */

          await home();

        }catch(error){

          console.error(
            error
          );

          toast(
            "Unable to load your account."
          );
        }

      }else{

        user = null;

        profile = null;

        following =
          new Set();

        showAuth();

      }

    }
  );


/* =========================================================
   START APPLICATION
========================================================= */

(async function(){

  const loggedIn =
    await loadSession();


  if(loggedIn){

    await home();

  }

})();

</script>
